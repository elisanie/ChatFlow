# Server Configuration
server.port=8081

# RabbitMQ Configuration
rabbitmq.host=172.31.11.98
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.virtual-host=/
rabbitmq.exchange=chat.exchange
rabbitmq.room-routing-prefix=room.
rabbitmq.room-count=20
rabbitmq.prefetch-count=50
rabbitmq.consumer-threads=8

# Broadcaster Configuration
broadcaster.enabled=true
broadcaster.base-url=http://chatflow-alb-308077375.us-west-2.elb.amazonaws.com
broadcaster.timeout-ms=2000

# Database Configuration
spring.datasource.url=jdbc:mysql://172.31.6.73:3306/chatflow?useSSL=false&rewriteBatchedStatements=true&serverTimezone=UTC
spring.datasource.username=chatapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

# Batch Processing Parameters
batch.size=1000
batch.flush-interval-ms=500

# Circuit Breaker Configuration
circuit-breaker.failure-threshold=3
circuit-breaker.open-duration-ms=10000